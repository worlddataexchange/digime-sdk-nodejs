name: Publish

on:
    workflow_dispatch:
        inputs:
            publish_tag:
                type: choice
                description: Select Tag
                options:
                    - unstable
                    - latest
                    - next
            custom_publish_tag_override:
            release:
                type: boolean

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "22.21.1"
                  registry-url: "https://registry.npmjs.org"
                  always-auth: false
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm run test
            - run: |

                  npm config delete //registry.npmjs.org/:_authToken || true

                  if [ "${CUSTOM_PUBLISH_TAG_OVERRIDE}" != "" ]; then
                    PUBLISH_TAG=${CUSTOM_PUBLISH_TAG_OVERRIDE}
                  fi

                  echo "Publish Tag: ${PUBLISH_TAG}"

                  if [ "${RELEASE}" == "true" ]; then
                    echo "Release"
                    npm publish --provenance --access public --tag ${PUBLISH_TAG}
                  else
                    echo "Release Dry Run"
                    npm publish --dry-run --provenance --access public --tag ${PUBLISH_TAG}
                  fi
              env:
                  NPM_CONFIG_PROVENANCE: "true"
                  PUBLISH_TAG: ${{ inputs.publish_tag }}
                  RELEASE: ${{ inputs.release }}
                  CUSTOM_PUBLISH_TAG_OVERRIDE: ${{ inputs.custom_publish_tag_override }}
